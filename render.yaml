services:
  - type: web
    name: momentum-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: gunicorn dashboard.app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
